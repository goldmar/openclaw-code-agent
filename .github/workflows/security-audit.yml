name: Security Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  prod-audit:
    name: pnpm audit --prod
    runs-on: ubuntu-latest
    steps:
      # Fetch only the immutable base policy; never run PR code with this token.
      - name: Check dependency preparation
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && vars.OCA_DEPENDENCY_BATCHING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OCA_DEPENDENCY_BATCHING_ENABLED: ${{ vars.OCA_DEPENDENCY_BATCHING_ENABLED }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          policy_path="$(mktemp "$RUNNER_TEMP/oca-dependency-policy.XXXXXX.mjs")"
          trap 'rm -f "$policy_path"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/dependency-maintenance.mjs?ref=${BASE_SHA}" --jq .content | base64 --decode > "$policy_path"
          node "$policy_path" --preparation

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - name: Prefer configured pnpm binary
        run: echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0

      - name: Audit published/runtime dependencies
        run: pnpm run audit:prod
