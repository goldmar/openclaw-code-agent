name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      # Fetch only the immutable base policy; never run PR code with this token.
      - name: Check dependency preparation
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && vars.OCA_DEPENDENCY_BATCHING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OCA_DEPENDENCY_BATCHING_ENABLED: ${{ vars.OCA_DEPENDENCY_BATCHING_ENABLED }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          policy_path="$(mktemp "$RUNNER_TEMP/oca-dependency-policy.XXXXXX.mjs")"
          trap 'rm -f "$policy_path"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/dependency-maintenance.mjs?ref=${BASE_SHA}" --jq .content | base64 --decode > "$policy_path"
          node "$policy_path" --preparation

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          build-mode: none
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
