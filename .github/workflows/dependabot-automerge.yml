name: Dependabot Policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  issue_comment:
    types: [created, edited]

concurrency:
  group: dependabot-policy-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

# Read-only observer. The weekly OCA owner is the only merge executor.
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  policy:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' &&
       (github.event.action != 'labeled' || github.event.label.name == 'dependency-ready')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'greptile-apps[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          submodules: false

      - name: Evaluate dependency policy (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          OCA_DEPENDENCY_BATCHING_ENABLED: ${{ vars.OCA_DEPENDENCY_BATCHING_ENABLED }}
        run: node scripts/dependency-maintenance.mjs --pr "$PR_NUMBER"
