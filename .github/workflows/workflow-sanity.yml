name: Workflow Sanity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  no-tabs:
    runs-on: ubuntu-latest
    steps:
      # Fetch only the immutable base policy; never run PR code with this token.
      - name: Check dependency preparation
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && vars.OCA_DEPENDENCY_BATCHING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OCA_DEPENDENCY_BATCHING_ENABLED: ${{ vars.OCA_DEPENDENCY_BATCHING_ENABLED }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          policy_path="$(mktemp "$RUNNER_TEMP/oca-dependency-policy.XXXXXX.mjs")"
          trap 'rm -f "$policy_path"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/dependency-maintenance.mjs?ref=${BASE_SHA}" --jq .content | base64 --decode > "$policy_path"
          node "$policy_path" --preparation

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Fail on tabs in workflow files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          bad = []
          root = Path(".github/workflows")
          for pattern in ("*.yml", "*.yaml"):
            for path in sorted(root.rglob(pattern)):
              if b"\t" in path.read_bytes():
                bad.append(str(path))

          if bad:
            print("Tabs found in workflow file(s):")
            for path in bad:
              print(f"- {path}")
            sys.exit(1)
          PY

  actionlint:
    runs-on: ubuntu-latest
    steps:
      # Fetch only the immutable base policy; never run PR code with this token.
      - name: Check dependency preparation
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && vars.OCA_DEPENDENCY_BATCHING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OCA_DEPENDENCY_BATCHING_ENABLED: ${{ vars.OCA_DEPENDENCY_BATCHING_ENABLED }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          policy_path="$(mktemp "$RUNNER_TEMP/oca-dependency-policy.XXXXXX.mjs")"
          trap 'rm -f "$policy_path"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/dependency-maintenance.mjs?ref=${BASE_SHA}" --jq .content | base64 --decode > "$policy_path"
          node "$policy_path" --preparation

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.12"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL -o "${archive}" "${base_url}/${archive}"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL -o checksums.txt "${base_url}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint
