version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    # CodeQL init/analyze must move together or the analysis workflow fails.
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Los_Angeles
    # Reduce noise only for development updates; runtime dependencies stay
    # isolated for npm-shrinkwrap and compatibility review.
    groups:
      low-risk-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
