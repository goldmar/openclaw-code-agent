version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    # Keep CodeQL init/analyze atomic inside one Actions PR.
    groups:
      weekly-actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    labels: [dependencies, dependency-preparing]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    rebase-strategy: disabled
    # allow.update-types restricts version updates, not urgent security fixes.
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#update-types-allow
    # A blanket ignore-major rule would also suppress major security proposals.
    # OpenClaw compatibility pins have a separate owner and never move here.
    allow:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@anthropic-ai/sdk"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@hono/node-server"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "express-rate-limit"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "fast-uri"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "hono"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "ip-address"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "qs"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "zod"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: fast-check
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: esbuild
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: tsx
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: typebox
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      low-risk-development:
        patterns: ["@types/node", fast-check]
        update-types: [minor, patch]
      stable-runtime-patches:
        patterns: ["@hono/node-server", express-rate-limit, fast-uri, hono, ip-address, qs, zod]
        update-types: [patch]
      reviewed-sdk-toolchain:
        patterns: ["*"]
        update-types: [minor, patch]
    # Three groups plus the separately held migration. Cutover must not alter #568.
    open-pull-requests-limit: 4
    labels: [dependencies, dependency-preparing]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /.github/release-tools
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      reviewed-release-tools:
        patterns: ["*"]
    open-pull-requests-limit: 1
    labels: [dependencies, dependency-preparing]
    commit-message:
      prefix: chore
      include: scope
