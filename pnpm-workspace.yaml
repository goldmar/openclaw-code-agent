packages:
  - .

allowBuilds:
  "@google/genai": false
  esbuild: true
  koffi: false
  openclaw: false
  protobufjs: true
  tree-sitter-bash: false

# No publication-age gate here: pnpm 11 checks every lockfile entry against
# minimumReleaseAge at install time, including frozen CI and release installs,
# so any window would block same-day OpenClaw compatibility and Claude SDK
# updates. Dependabot's 3-day cooldown (.github/dependabot.yml) delays
# automated updates instead; manual bumps are reviewed (docs/DEVELOPMENT.md).
minimumReleaseAge: 0

overrides:
  basic-ftp: 5.3.1
  axios@<1.15.0: ">=1.15.0"
  fast-xml-builder@<1.1.7: 1.1.7
  follow-redirects@<1.16.0: 1.16.0
  protobufjs@>=7 <7.6.5: 7.6.5
  tar@<7.5.21: 7.5.21
  "@protobufjs/utf8@<1.1.1": 1.1.1
  brace-expansion@>=4.0.0 <5.0.7: ">=5.0.7"
  path-to-regexp@>=8.0.0 <8.4.0: ">=8.4.0"
  "@anthropic-ai/sdk@<0.93.0": 0.93.0
  ip-address@<10.7.2: 10.7.2
  fast-uri@<3.1.8: 3.1.8
  qs@<6.16.0: 6.16.0
  hono@<4.13.9: 4.13.9
  "@hono/node-server@<2.1.1": 2.1.1
  undici@>=8.0.0 <8.9.0: 8.9.0
